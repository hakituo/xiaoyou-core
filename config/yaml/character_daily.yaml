# QQ 官方机器人 · Coco（新媒体运营，熬夜冠军，上海）
# 不接入 active_care（QQ 官方机器人发不了主动消息），仅由 character_daily + sleep_manager 推进作息
yeye:
  wake_time: "09:00"
  sleep_time: "02:00"

  sleep_profile:
    chronotype: "night_owl"
    weekday_wake_time: "09:00"
    weekend_wake_time: "11:00"
    weekday_sleep_time: "02:00"
    weekend_sleep_time: "03:00"
    sleep_inertia_tendency: 0.6
    night_owl_tendency: 0.8
    late_snack_tendency: 0.5
    nap_tendency: 0.4
    oversleep_tendency: 0.3
    nightmare_tendency: 0.1
    wake_by_message_sensitivity: 0.55
    resume_sleep_tendency: 0.5
    schedule_adjust_tendency: 0.4
    diary_backfill_tendency: 0.05
    silence_window_seconds: 180

  time_blocks:
    - period: "morning_routine"      # 09:00-10:00
      start: "09:00"
      end: "10:00"
      fixed:
        - { activity: "waking_up", duration: [15, 30] }
      pool:
        - { activity: "breakfast", duration: [15, 25], weight: 5 }
        - { activity: "phone_scrolling", duration: [10, 20], weight: 3 }
        - { activity: "self_care", duration: [10, 18], weight: 1 }

    - period: "morning_work"         # 10:00-12:30 上班剪视频/写文案
      start: "10:00"
      end: "12:30"
      fixed: []
      pool:
        - { activity: "studying",        duration: [60, 120], weight: 4 }
        - { activity: "phone_scrolling", duration: [15, 30], weight: 2 }
        - { activity: "reading",         duration: [20, 40], weight: 1 }

    - period: "lunch"                # 12:30-13:30
      start: "12:30"
      end: "13:30"
      fixed:
        - { activity: "lunch", duration: [15, 25] }
      pool:
        - { activity: "phone_scrolling", duration: [10, 25], weight: 3 }

    - period: "afternoon_rest"       # 13:30-14:30
      start: "13:30"
      end: "14:30"
      fixed: []
      pool:
        - { activity: "napping",         duration: [15, 30], weight: 3 }
        - { activity: "phone_scrolling", duration: [10, 20], weight: 2 }
        - { activity: "idle",            duration: [10, 15], weight: 1 }

    - period: "afternoon_work"       # 14:30-18:30
      start: "14:30"
      end: "18:30"
      fixed: []
      pool:
        - { activity: "studying",        duration: [60, 120], weight: 4 }
        - { activity: "reading",         duration: [25, 50], weight: 2 }
        - { activity: "walking",         duration: [15, 30], weight: 1 }
        - { activity: "shopping",        duration: [20, 40], weight: 1 }

    - period: "dinner"               # 18:30-19:30
      start: "18:30"
      end: "19:30"
      fixed:
        - { activity: "cooking", duration: [15, 30] }
        - { activity: "dinner",  duration: [15, 25] }
      pool: []

    - period: "evening"              # 19:30-23:30
      start: "19:30"
      end: "23:30"
      fixed: []
      pool:
        - { activity: "gaming",          duration: [40, 90], weight: 4 }
        - { activity: "phone_scrolling", duration: [20, 40], weight: 3 }
        - { activity: "reading",         duration: [25, 50], weight: 2 }
        - { activity: "creative_hobby", duration: [20, 45], weight: 1 }
        - { activity: "self_care",       duration: [10, 20], weight: 1 }
        - { activity: "idle",            duration: [10, 20], weight: 2 }

    - period: "late_night"           # 23:30-02:00 熬夜时段
      start: "23:30"
      end: "02:00"
      fixed: []
      pool:
        - { activity: "staying_up_late", duration: [30, 60], weight: 4 }
        - { activity: "gaming",          duration: [40, 90], weight: 3 }
        - { activity: "phone_scrolling", duration: [20, 40], weight: 3 }
        - { activity: "late_snack",      duration: [10, 20], weight: 2 }
        - { activity: "reading",         duration: [15, 30], weight: 1 }


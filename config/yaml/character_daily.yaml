# ============================================================
# 角色日常日程配置（Character Daily Schedule）
#
# 每个角色有独立的作息模板，包含：
#   - wake_time / sleep_time: 起床和睡觉时间
#   - time_blocks: 每天的活动时段模板
#     - fixed: 固定活动（如吃饭、起床），按顺序执行
#     - pool: 候选活动池，由共享确定性评分和容量算法选择组合
#   - rest_day_extras: 可选，按 period 配置周末额外候选，不在 Python 中写角色特例
#
# 同角色同日期结果稳定；日期、角色和候选键的稳定哈希带来适度日间变化。
# ============================================================

aveline:
  wake_time: "07:00"
  sleep_time: "23:00"

  rest_day_extras:
    morning_routine:
      - { activity: "self_care", duration: [10, 20], weight: 1.2 }
    afternoon_activity:
      - { activity: "creative_hobby", duration: [30, 60], weight: 1.5 }
      - { activity: "exercising", duration: [20, 35], weight: 1.1 }
    evening:
      - { activity: "creative_hobby", duration: [25, 50], weight: 1.3 }
      - { activity: "self_care", duration: [15, 25], weight: 1.1 }
    bedtime:
      - { activity: "self_care", duration: [10, 20], weight: 1.5 }

  time_blocks:
    - period: "morning_routine"      # 07:00-08:30
      start: "07:00"
      end: "08:30"
      fixed:
        - { activity: "waking_up", duration: [15, 30] }
      pool:
        - { activity: "cooking",   duration: [20, 35], weight: 3 }
        - { activity: "breakfast", duration: [15, 25], weight: 5 }
        - { activity: "self_care", duration: [10, 20], weight: 2 }
        - { activity: "housework", duration: [10, 20], weight: 1 }

    - period: "morning_study"        # 09:00-12:00
      start: "09:00"
      end: "12:00"
      fixed: []
      pool:
        - { activity: "studying",  duration: [45, 90], weight: 4 }
        - { activity: "reading",   duration: [30, 60], weight: 3 }
        - { activity: "housework", duration: [15, 30], weight: 1 }

    - period: "lunch"                # 12:00-13:00
      start: "12:00"
      end: "13:00"
      fixed:
        - { activity: "cooking", duration: [20, 35] }
        - { activity: "lunch",   duration: [15, 25] }
      pool: []

    - period: "afternoon_rest"       # 13:00-14:00
      start: "13:00"
      end: "14:00"
      fixed: []
      pool:
        - { activity: "napping",         duration: [20, 40], weight: 3 }
        - { activity: "phone_scrolling", duration: [15, 30], weight: 2 }
        - { activity: "reading",         duration: [20, 40], weight: 2 }

    - period: "afternoon_activity"   # 14:00-17:30
      start: "14:00"
      end: "17:30"
      fixed: []
      pool:
        - { activity: "studying",  duration: [45, 90], weight: 3 }
        - { activity: "reading",   duration: [30, 60], weight: 2 }
        - { activity: "walking",   duration: [20, 45], weight: 2 }
        - { activity: "gardening", duration: [15, 30], weight: 1 }
        - { activity: "creative_hobby", duration: [25, 50], weight: 1 }
        - { activity: "exercising", duration: [20, 35], weight: 1 }

    - period: "dinner"               # 17:30-19:00
      start: "17:30"
      end: "19:00"
      fixed:
        - { activity: "cooking", duration: [25, 40] }
        - { activity: "dinner",  duration: [15, 25] }
      pool: []

    - period: "evening"              # 19:00-22:30
      start: "19:00"
      end: "22:30"
      fixed: []
      pool:
        - { activity: "reading",         duration: [30, 60], weight: 3 }
        - { activity: "phone_scrolling", duration: [15, 30], weight: 2 }
        - { activity: "housework",       duration: [15, 30], weight: 1 }
        - { activity: "creative_hobby",  duration: [20, 45], weight: 1 }
        - { activity: "self_care",       duration: [10, 20], weight: 1 }
        - { activity: "idle",            duration: [10, 20], weight: 2 }

    - period: "bedtime"              # 22:30-23:00
      start: "22:30"
      end: "23:00"
      fixed: []
      pool:
        - { activity: "phone_scrolling", duration: [10, 20], weight: 3 }
        - { activity: "reading",         duration: [10, 20], weight: 2 }
        - { activity: "self_care",       duration: [10, 18], weight: 2 }


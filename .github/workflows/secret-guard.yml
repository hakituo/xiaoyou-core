# Secret / 大型文件防误提交检查
# 为节省 GitHub Actions 额度，当前仅允许手动触发。
# 手动运行时扫描改动，避免 API Key / 模型权重 / 超大文件误提交。
name: Secret Guard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: 敏感文件 / 大文件扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（拉取完整历史以支持差异比较）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 扫描改动文件
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ -z "${BASE_SHA:-}" ] || [ "${BASE_SHA:-}" = "0000000000000000000000000000000000000000" ]; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only --diff-filter=ACM "${BASE_SHA}...${HEAD_SHA}")
          fi
          [ -n "$changed" ] || { echo "无改动文件"; exit 0; }

          bad=0
          huge_limit=52428800
          weight_re='\.(gguf|safetensors|pt|pth|ckpt|ckpt\.index|onnx|bin|npy|npz|pb|tflite)$'

          for f in $changed; do
            [ -f "$f" ] || continue
            case "$f" in
              .github/*|.git/*) continue ;;
            esac
            base=$(basename "$f")
            if echo "$f" | grep -Eq "$weight_re"; then
              echo "::error::疑似模型权重/二进制文件被纳入 git: $f"
              bad=1
              continue
            fi
            let_sensitive=0
            if echo "$base" | grep -Eq '^\.env($|[.-])'; then
              [ "$base" = ".env.example" ] || let_sensitive=1
            fi
            if echo "$base" | grep -Eq '\.(key|pem|p12|pfx|p8)$'; then
              let_sensitive=1
            fi
            if echo "$base" | grep -Eq '^(secrets?\.ya?ml|sa\.json|service-account.*json|credential.*\.(json|ya?ml))$'; then
              let_sensitive=1
            fi
            if echo "$base" | grep -Eq '(id_rsa|\.git-credentials)$'; then
              let_sensitive=1
            fi
            if echo "$base" | grep -Eq '^(token|api[_-]?key|secret|credential|private[_-]?key|auth)([-_.][[:alnum:]_-]+)?\.(json|yaml|yml|toml|ini|env)$'; then
              [ -f "$base.example" ] || case "$f" in *.example) ;; *) let_sensitive=1 ;; esac
            fi
            if [ "$let_sensitive" -eq 1 ]; then
              echo "::error::疑似敏感/凭据文件被纳入 git: $f"
              bad=1
              continue
            fi
            size=$(wc -c < "$f" 2>/dev/null || echo 0)
            if [ "$size" -gt "$huge_limit" ]; then
              echo "::error::超大文件($size bytes)被纳入 git，疑似模型/产物: $f"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::检测到敏感/大文件改动，请将其加入 .gitignore 或移除，避免泄漏。"
            exit 1
          fi
          echo "扫描通过：未发现敏感凭据 / 模型权重 / 超大文件。"
